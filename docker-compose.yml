version: '3.8'

services:
  backend:
    build: ./fastapi
    expose:
      - "8000"
    networks:
      - app_network

  frontend:
    build: ./skeleton-v3
    expose:
      - "3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - app_network
      
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge